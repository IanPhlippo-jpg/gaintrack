name: iOS build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Unsigned .ipa (voor Sideloadly / AltStore)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Web-app bouwen
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Xcode-versie
        run: xcodebuild -version

      - name: Bouwen zonder code signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -quiet \
            build

      - name: .ipa inpakken
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr GainTrack-unsigned.ipa Payload
          ls -la GainTrack-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GainTrack-unsigned-ipa
          path: GainTrack-unsigned.ipa
          retention-days: 30
